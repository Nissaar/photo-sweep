#
# Grouped and monthly on purpose. An app maintained by one person drowns in a dozen
# separate patch PRs a week and stops reading any of them, which is worse than
# updating a little less often and actually looking.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      php-tooling:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      android:
        patterns: ['*']
        update-types: [minor, patch]
    # Kotlin is held below 2.4.20 on purpose: the CodeQL extractor refuses anything
    # newer, and the Kotlin security scan then silently stops running. Lift this when
    # CodeQL supports it; commit c82af88 has the extractor error.
    ignore:
      - dependency-name: 'org.jetbrains.kotlin.*'
        versions: ['>= 2.4.20']
      - dependency-name: 'org.jetbrains.kotlin:*'
        versions: ['>= 2.4.20']

  # Workflows pin every action to a full commit SHA, with the release it came from in
  # a trailing comment. A tag can be moved to other code; a SHA cannot, so nothing
  # changes what runs next to the signing keys except one of these PRs, which bumps
  # the SHA and the comment together. Worth seeing separately from library bumps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
