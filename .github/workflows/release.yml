#
# Publishes the Nextcloud app: builds the frontend, assembles the package, signs its
# contents with the app certificate, tars it, attaches it to the GitHub release and
# registers the release with the Nextcloud app store.
#
# Split in two on purpose. The build job runs npm and composer, which means it runs
# install scripts from hundreds of packages nobody here has read, so it gets no
# secrets and a read-only token. The publish job gets the signing key and the store
# token, and runs nothing but this repository's own Makefile, openssl, a pinned
# Nextcloud image and the release action. A compromised dependency can break the
# build; it cannot read the key, which cannot be replaced once it leaks.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build the package
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      number: ${{ steps.version.outputs.number }}

    steps:
      # The tag reaches the shell through env rather than being pasted into the
      # script, and has to look like a release before anything else uses it.
      - name: Resolve version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::'$TAG' is not a release tag of the form v1.2.3"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"

      # On workflow_dispatch github.ref_name is the branch, so check out the tag
      # explicitly rather than whatever main happens to be.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false

      # A tag that disagrees with info.xml ships a mislabelled release, and the app
      # store records whatever the XML says. Fail here instead.
      - name: Check the tag matches info.xml
        env:
          NUMBER: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          DECLARED=$(sed -ne 's|^[[:space:]]*<version>\(.*\)</version>|\1|p' appinfo/info.xml)
          if [ "$NUMBER" != "$DECLARED" ]; then
            echo "::error::Tag $NUMBER does not match <version>$DECLARED</version> in appinfo/info.xml"
            exit 1
          fi
          echo "Version $DECLARED matches the tag."

      # Tests, lint and the info.xml schema check are not repeated here: the ci job
      # below runs the whole of CI against this tag, and publish waits for it.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Build the frontend
        run: |
          npm ci
          npm run build
          test -s js/photosweep-main.js

      - name: Assemble the package
        run: make package

      - name: Hand the package to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: build/photosweep/
          if-no-files-found: error
          retention-days: 7

  # Every CI job, the acceptance runs against real Nextcloud 31 and 34 included. A tag
  # on a commit that fails them is not signed or published.
  ci:
    name: CI
    needs: build
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.build.outputs.tag }}

  publish:
    name: Sign and publish the app
    needs: [build, ci]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Only for the Makefile. Nothing from npm or composer is installed or run in
      # this job, which is the reason it can hold the key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tag }}
          persist-credentials: false

      - name: Fetch the package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: build/photosweep

      # Signing is optional so the workflow still works in a fork with no secrets:
      # without a certificate it publishes an unsigned tarball and labels it as such.
      # The app store will refuse an unsigned one, which is the point.
      #
      # The `secrets` context cannot be used in a step-level `if`, so this step looks
      # at them once and later steps decide on its outputs. That keeps every secret
      # confined to the steps that actually use it.
      - name: See which secrets are present
        id: secrets
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_STORE_TOKEN: ${{ secrets.APP_STORE_TOKEN }}
        run: |
          echo "signing=$([ -n "$APP_PRIVATE_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "store=$([ -n "$APP_STORE_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Write the signing material
        if: steps.secrets.outputs.signing == 'true'
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_CERTIFICATE: ${{ secrets.APP_CERTIFICATE }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/certs"
          ( umask 077; printf '%s' "$APP_PRIVATE_KEY" > "$RUNNER_TEMP/certs/photosweep.key" )
          printf '%s' "$APP_CERTIFICATE" > "$RUNNER_TEMP/certs/photosweep.crt"

      # `integrity:sign-app` writes appinfo/signature.json, which is what a server
      # checks. It needs an `occ`, so it runs inside the official image.
      #
      # From /usr/src/nextcloud, not /var/www/html. The image ships the release in
      # the former and its entrypoint copies it to the latter on first start —
      # overriding the entrypoint, which is the whole point here, means that copy
      # never happens and /var/www/html is empty. Signing needs no installed
      # instance: SignApp is registered before occ checks for one.
      #
      # The image is pinned by digest because it is handed the private key. This is
      # Nextcloud 34.0.4, what `stable` pointed to on 2026-09-26. Dependabot does not
      # update digests in workflow files, so move it by hand now and then.
      - name: Sign the package contents
        if: steps.secrets.outputs.signing == 'true'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/build:/build" \
            -v "$RUNNER_TEMP/certs:/certs:ro" \
            --entrypoint php \
            nextcloud:34-apache@sha256:3bc2f3e2bceb2ba2537ddb0915a9a033e4e9c0a5bdbec08c3f92657468d18f0c \
            /usr/src/nextcloud/occ integrity:sign-app \
              --privateKey=/certs/photosweep.key \
              --certificate=/certs/photosweep.crt \
              --path=/build/photosweep
          test -s build/photosweep/appinfo/signature.json
          echo "Signed $(python3 -c "import json;print(len(json.load(open('build/photosweep/appinfo/signature.json'))['hashes']))") files."

      - name: Warn that the build is unsigned
        if: steps.secrets.outputs.signing != 'true'
        run: echo "::warning::No APP_PRIVATE_KEY secret — publishing an unsigned tarball. The Nextcloud app store will refuse it."

      - name: Make the tarball
        run: make tarball

      - name: Checksums
        working-directory: build/artifacts
        run: sha256sum photosweep-*.tar.gz | tee -a SHA256SUMS.txt

      # The store verifies this against the registered certificate before it will
      # accept the download URL.
      - name: Sign the tarball for the store API
        if: steps.secrets.outputs.signing == 'true'
        env:
          NUMBER: ${{ needs.build.outputs.number }}
        run: |
          set -euo pipefail
          openssl dgst -sha512 -sign "$RUNNER_TEMP/certs/photosweep.key" \
            "build/artifacts/photosweep-${NUMBER}.tar.gz" \
            | openssl base64 -A > "$RUNNER_TEMP/signature.txt"
          rm -rf "$RUNNER_TEMP/certs"

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Required for workflow_dispatch, where the run is not tag-triggered.
          tag_name: ${{ needs.build.outputs.tag }}
          files: |
            build/artifacts/photosweep-*.tar.gz
            build/artifacts/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Install

            Most people should install from the
            [Nextcloud app store](https://apps.nextcloud.com/apps/photosweep):
            **Apps → Multimedia → Photo Sweep → Download and enable**.

            To install this tarball by hand, unpack it into your server's apps
            directory — the folder must be named `photosweep` — and enable it:

            ```bash
            tar -xzf photosweep-*.tar.gz -C /path/to/nextcloud/custom_apps/
            sudo -u www-data php occ app:enable photosweep
            sudo -u www-data php occ photosweep:index <user> --until-complete
            ```

            Verify the download against `SHA256SUMS.txt` first.

            ## Before you delete anything

            Deletions are real. In trash mode they go to your Nextcloud trash and stay
            recoverable for as long as your server's retention policy allows — which an
            admin can set to something short, and which does not exist at all if
            `files_trashbin` is disabled. The app tells you which case you are in, but
            a backup is the actual safety net.

            Requires Nextcloud 31–34 and PHP 8.1+.

      # The store pulls the tarball from the release it was just attached to, so this
      # has to come last. --fail-with-body rather than -f: when the store refuses a
      # release, the reason is in the response body, and -f throws that away.
      - name: Register the release with the app store
        if: steps.secrets.outputs.signing == 'true' && steps.secrets.outputs.store == 'true'
        env:
          APP_STORE_TOKEN: ${{ secrets.APP_STORE_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          NUMBER: ${{ needs.build.outputs.number }}
        run: |
          set -euo pipefail
          TARBALL="photosweep-${NUMBER}.tar.gz"
          DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${TARBALL}"

          curl -sS --fail-with-body -X POST https://apps.nextcloud.com/api/v1/apps/releases \
            -H "Authorization: Token ${APP_STORE_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
                  --arg download "$DOWNLOAD" \
                  --arg signature "$(cat "$RUNNER_TEMP/signature.txt")" \
                  '{download: $download, signature: $signature, nightly: false}')"
          echo
          echo "Published $DOWNLOAD to the app store."

      - name: Say what was skipped
        if: steps.secrets.outputs.signing != 'true' || steps.secrets.outputs.store != 'true'
        run: echo "::notice::Not published to the app store — see docs/PUBLISHING.md for the certificate and token setup."
