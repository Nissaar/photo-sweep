name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # The outbox is what keeps verdicts safe across a lost connection, so its
      # report is worth keeping even when a later step fails.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Release runs R8, which catches missing keep rules that debug never exercises —
      # the serializers would be stripped without them. Do it on every change so it
      # cannot surface for the first time at a release tag.
      - name: Assemble release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      # The app's main privacy claim is that it asks for almost nothing. Assert that,
      # so a dependency cannot quietly introduce a permission in a future release.
      - name: Assert the permission set has not grown
        run: |
          set -euo pipefail
          MANIFEST=app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          [ -f "$MANIFEST" ] || { echo "::error::merged manifest not found at $MANIFEST"; exit 1; }

          PERMS=$({ grep -o 'android:name="android.permission[^"]*"' "$MANIFEST" || true; } \
                  | sed 's/.*permission\.//; s/"//' | sort -u)
          EXPECTED=$(printf '%s\n' INTERNET USE_BIOMETRIC USE_FINGERPRINT | sort -u)

          echo "Declared:"; echo "$PERMS"
          if [ "$PERMS" != "$EXPECTED" ]; then
            echo "::error::Permission set changed."
            diff <(echo "$EXPECTED") <(echo "$PERMS") || true
            exit 1
          fi
          echo "Permission set unchanged."

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
