#
# Scans this app the way somebody who did not write it would: for code patterns that
# are exploitable, and for dependencies with known advisories.
#
# This deliberately does not duplicate CI. psalm already types the PHP, and the PHP is
# where this app does its dangerous work — CodeQL has no PHP analyser, so the coverage
# here is the frontend and the Android client.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  # An advisory published next month is about code that is already written, so the
  # scan has to come back on its own rather than waiting for the next commit.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql-frontend:
    name: CodeQL javascript
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          category: /language:javascript-typescript

  codeql-android:
    name: CodeQL kotlin
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      # Caching is switched off for this job alone. CodeQL extracts Kotlin by
      # watching the compiler run, so a cache hit is indistinguishable from an empty
      # project: the build goes green in twenty seconds, compileDebugKotlin reports
      # FROM-CACHE, and the analysis then fails having seen no code at all.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      # Kotlin has to be compiled to be extracted — unlike Java, it cannot be read
      # from source alone, which is what `build-mode: none` does. So this job builds
      # the app properly, which is also why it is separate from the frontend scan
      # rather than a second leg of one matrix.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build the client
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Analyse
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          category: /language:java-kotlin

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only the production tree fails the build. Everything in devDependencies is
      # build tooling that never reaches a server, and letting a webpack plugin's
      # advisory block a release would teach everyone to ignore this job.
      - name: Audit what actually ships
        run: npm audit --omit=dev --audit-level=high

      - name: Audit the build tooling, for information
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      # The app has no runtime composer dependencies, so this covers the dev tools.
      # Reported rather than enforced, for the same reason as the npm tooling above.
      - name: Audit composer packages, for information
        continue-on-error: true
        run: |
          composer install --prefer-dist --no-progress
          composer audit
