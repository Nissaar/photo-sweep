name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs all of this, the Nextcloud acceptance runs included,
  # and signs nothing unless it passes. On a manual release github.ref is a branch,
  # so the caller says which tag to test.
  workflow_call:
    inputs:
      ref:
        description: 'Tag or commit to test; empty means the triggering ref'
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Cancel superseded runs on the same branch rather than queueing them. The workflow
# name is in the group because a called run inherits the caller's github context: a
# manual release from main would otherwise cancel, or be cancelled by, CI on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor is what info.xml declares; the ceiling is what current
        # Nextcloud releases actually run on.
        php: ['8.1', '8.4']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Lint every source file
        run: find lib appinfo tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Coding standard
        run: composer run cs:check

      - name: Static analysis
        run: composer run psalm

      - name: Unit tests
        run: composer run test:unit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Fail if the build produced nothing
        run: test -s js/photosweep-main.js

  appinfo:
    name: App metadata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Not on the runner image any more, and its absence fails the step with a
      # bare 127 that looks nothing like a schema problem.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Fetch the app store schema
        run: curl -sSfL https://apps.nextcloud.com/schema/apps/info.xsd -o /tmp/info.xsd

      # A malformed info.xml is otherwise only discovered when the app store rejects
      # the upload, which is the worst moment to find out.
      - name: Validate info.xml
        run: xmllint --noout --schema /tmp/info.xsd appinfo/info.xml

      - name: Check the version is consistent
        run: |
          set -euo pipefail
          XML=$(sed -ne 's|^[[:space:]]*<version>\(.*\)</version>|\1|p' appinfo/info.xml)
          PKG=$(node -p "require('./package.json').version")
          if [ "$XML" != "$PKG" ]; then
            echo "::error::appinfo/info.xml says $XML but package.json says $PKG"
            exit 1
          fi
          echo "Version $XML is consistent."

  integration:
    name: Nextcloud ${{ matrix.nextcloud }}
    runs-on: ubuntu-latest
    needs: [php, frontend]

    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range info.xml declares support for. Anything in between
        # that breaks will almost always break one of these too.
        nextcloud: ['31', '34']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Assemble the app exactly as it ships
        run: |
          npm ci
          npm run build
          make package

      # Unit tests and psalm passed on both of the worst bugs this app has had: a keep
      # verdict that could never be saved, and a restored photo that never returned to
      # the index. Only a real server catches that class of thing.
      - name: Acceptance run
        run: tests/integration/acceptance.sh ${{ matrix.nextcloud }} 8080

      # The acceptance script removes its container on the way out, so it copies the
      # server's log out first when anything failed. That copy is the only record.
      - name: Nextcloud log
        if: failure()
        run: tail -n 100 build/integration-logs/*.log || true

      - name: Upload the Nextcloud log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextcloud-log-${{ matrix.nextcloud }}
          path: build/integration-logs/
          retention-days: 14
          if-no-files-found: ignore
